<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A4D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chấm công">
<link rel="manifest" href="manifest.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#1F3A4D; --steel-2:#2E5470; --zinc:#E9EDF0; --page:#F5F7F8; --card:#FFFFFF;
  --ink:#16222B; --muted:#5E6E7A; --line:#D8DFE4; --hiviz:#F2B705; --hiviz-ink:#3A2C00;
  --ok:#2F6B1E; --okbg:#E5F2DC; --wait:#8A5A00; --waitbg:#FDF1D6; --bad:#A12B2B; --badbg:#FBE7E7;
}
@media (prefers-color-scheme:dark){:root{
  --steel:#9FC2DB; --steel-2:#C3D9E8; --zinc:#22313B; --page:#11191F; --card:#18232B;
  --ink:#E8EEF2; --muted:#9AABB7; --line:#2C3B46; --hiviz:#F2B705; --hiviz-ink:#2A2000;
  --ok:#B5DC9C; --okbg:#21391A; --wait:#F5CF7A; --waitbg:#3D2C08; --bad:#F2B0B0; --badbg:#4A1A1A;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 92px}
h1{font-size:20px;font-weight:600;margin:0}
h2{font-size:16px;font-weight:600;margin:20px 0 8px}
.muted{color:var(--muted);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num{font-size:22px;font-weight:600;color:var(--steel)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--steel-2);outline-offset:1px}
button{font:inherit;font-weight:500;border-radius:8px;padding:11px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;width:100%}
button.main{background:var(--steel);border-color:var(--steel);color:var(--page)}
button.small{width:auto;padding:7px 12px;font-size:13px}
button:disabled{opacity:.6}
.punch{display:block;width:100%;max-width:380px;margin:8px auto 14px;padding:16px 18px;border-radius:14px;border:none;background:var(--hiviz);color:var(--hiviz-ink);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.punch b{display:block;font-size:19px;font-weight:700}
.punch span{font-size:13px}
.punch.done{background:var(--zinc);color:var(--muted)}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)} .p-wait{background:var(--waitbg);color:var(--wait)} .p-bad{background:var(--badbg);color:var(--bad)}
.err{color:var(--bad);font-size:13px;margin:6px 0 0}
.note{color:var(--muted);font-size:13px;margin:6px 0 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 calc(100% / 4.5);border:none;background:none;padding:4px 2px;font-size:12px;color:var(--muted);position:relative;border-radius:0;scroll-snap-align:start;white-space:nowrap}
.nav button.on{color:var(--steel);font-weight:600}
.nav svg{width:22px;height:22px;display:block;margin:0 auto 2px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:0;left:55%;background:var(--bad);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;line-height:17px}
.veil{position:fixed;inset:0;background:rgba(10,20,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.pin{letter-spacing:14px;text-align:center;font-size:24px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);max-width:92%;background:var(--steel);color:var(--page);padding:10px 14px;border-radius:8px;z-index:30;font-size:14px}
.toast.bad{background:var(--bad);color:#fff}
.center{text-align:center}
.side{display:none}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.ava{width:56px;height:56px;border-radius:50%;background:var(--zinc);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px;color:var(--steel);overflow:hidden;cursor:pointer;flex:none;border:2px solid var(--hiviz)}
.ava img{width:100%;height:100%;object-fit:cover}
.cty{font-size:11px;font-weight:600;color:var(--steel-2);letter-spacing:.03em;text-transform:uppercase}
.side .brand{padding:6px 12px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side button{display:flex;align-items:center;gap:10px;text-align:left;border:none;background:none;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:500;margin-bottom:2px}
.side button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side button:hover{background:var(--card)}
.side button.on{background:var(--card);color:var(--steel);box-shadow:inset 3px 0 0 var(--hiviz)}
.linkbtn{display:flex;justify-content:space-between;align-items:center;text-align:left;margin-bottom:8px}
.right{display:none}
.mic{width:44px;height:44px;border-radius:50%;border:2px solid #D7262E;background:#fff;color:#D7262E;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;cursor:pointer}
.mic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.mic.dang{background:#D7262E;color:#fff;animation:nhayMic 1s infinite}
@keyframes nhayMic{50%{box-shadow:0 0 0 8px rgba(215,38,46,.2)}}
.vx-item{border-top:1px solid var(--line);padding:8px 0}
.login-wrap{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 14px}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 26px 22px;box-shadow:0 12px 32px rgba(0,0,0,.08)}
.login-logo{display:block;width:230px;max-width:80%;margin:0 auto}
.slogan{text-align:center;color:#6E6E6E;font-style:italic;letter-spacing:.4px;margin:8px 0 20px;font-size:15px}
.login-card h2{font-size:17px;text-align:center;margin:0 0 14px;color:var(--steel)}
.login-card button.main{width:100%;margin-top:4px}
.login-card details summary{font-size:13px}
.login-foot{color:var(--muted);font-size:12px;margin-top:14px;text-align:center}
.hd-link{width:auto;float:right;font-size:13px;font-weight:700;color:#D7262E;cursor:pointer;border:1.5px solid #D7262E;border-radius:999px;padding:2px 10px;background:none;margin:0 0 6px 8px}
.hd-box{clear:both;background:#FFF7DB;border:1.5px solid #F2B705;border-radius:12px;padding:10px 14px;margin:4px 0 10px;font-size:14px;line-height:1.5}
.hd-box ol{margin:4px 0 6px;padding-left:20px}
.hd-box b{color:#1F3A4D}
.viec{border:3px solid #D7262E;border-radius:16px;background:var(--card);padding:16px 18px;margin-bottom:14px}
.viec h3{font-size:20px}
.buoc{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:16px;line-height:1.4}
.buoc i{flex:none;width:30px;height:30px;border-radius:50%;background:#F2B705;color:#1F3A4D;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center}
.nutTo{width:100%;padding:14px;font-size:17px;font-weight:700;border-radius:12px}
.nhom-menu{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.nhom-menu h5{margin:0;background:#D7262E;color:#fff;font-size:12px;letter-spacing:.06em;padding:8px 14px;font-weight:700;text-transform:uppercase}
.side .nhom-menu button{width:100%;border-radius:0;margin:0;border-bottom:1px solid var(--line);padding:11px 14px;color:var(--ink,#1d1d1f);font-weight:600}
.side .nhom-menu button:last-child{border-bottom:none}
.side .nhom-menu button:hover{background:#FFF5F5}
.side .nhom-menu button.on{background:#FDECEC;color:#D7262E;box-shadow:inset 3px 0 0 #D7262E}
.mn-badge{margin-left:auto;background:#D7262E;color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.seg button{width:auto;flex:0 0 auto}
.seg.nho button{padding:6px 14px;font-size:14px}
.locLS{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:0 0 6px}
.locLS label{margin-top:0}
.seg button{border-radius:999px;padding:9px 18px;font-weight:600;border:1.5px solid #2b2b2b;background:var(--card);color:#2b2b2b}
.seg button.on{background:#D7262E;border-color:#D7262E;color:#fff}
.dong{display:block;width:100%;margin-top:14px;padding:14px;font-size:17px;font-weight:700;background:var(--bad);color:#fff;border:none;border-radius:12px;cursor:pointer}
.dong:active{opacity:.85}
.hero{display:flex;gap:16px;align-items:center;padding:18px;background:linear-gradient(135deg,var(--card),var(--zinc))}
.ava.lon{width:76px;height:76px;font-size:28px}
.ava.vua{width:42px;height:42px;font-size:16px;flex:none}
.bt-nguoi{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.bt-nguoi:first-of-type{border-top:none}
.bt-dem{margin-left:auto;font-size:12px;font-weight:600;white-space:nowrap}
.chi-hep{display:block;margin-top:14px}
@media (min-width:1280px){.chi-hep{display:none}}
.ava.nho{width:36px;height:36px;font-size:14px;flex:none}
.sodo{border-left:4px solid var(--steel)}
.sodo h3{margin:0;font-size:16px;color:var(--steel);display:flex;justify-content:space-between;align-items:center}
.cap{margin:12px 0 0 6px;padding-left:14px;border-left:2px dashed var(--line);position:relative}
.cap h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.luoi-nv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.the-nv{display:flex;gap:10px;align-items:center;background:var(--zinc);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;border:none;width:100%}
.the-nv:hover{outline:2px solid var(--line)}
.the-nv .ten{font-weight:600;font-size:14px;line-height:1.25}
.the-nv .cv{font-size:12px;color:var(--muted);line-height:1.25}
.trong{border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px}
.luoi5{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (min-width:700px){.luoi5{grid-template-columns:repeat(5,minmax(0,1fr))}}
.luoi4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
@media (min-width:600px){.luoi4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.so{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.so span{display:block;font-size:12px;color:var(--muted)}
.so b{display:block;font-size:20px;font-weight:600;color:var(--steel)}
.the h3{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 8px;color:var(--steel)}
.the h3 svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}
.kv b{font-weight:500;text-align:right}
.ql{margin:0;padding-left:18px;font-size:14px}
.ql li{margin:5px 0}
.tui{margin-top:16px}
.tui summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.tui summary::-webkit-details-marker{display:none}
.tui summary b{color:var(--steel)}
.tui[open] summary .mui{transform:rotate(90deg)}
.side button{color:var(--bad);font-weight:600}
.side button.on{color:var(--bad);font-weight:700}
.right b{color:var(--bad)}
.nhay{color:var(--bad);font-weight:700}
.badge.nhay{color:#fff}
@media (prefers-reduced-motion:no-preference){
  .nhay{animation:nhay 1.1s ease-in-out infinite}
  @keyframes nhay{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}
}
@media (min-width:1280px){
  #app{max-width:1480px !important}
  .wrap{grid-template-columns:250px minmax(0,640px) 340px !important}
  .right{display:block;position:sticky;top:24px;align-self:start}
}
@media (min-width:900px){
  #app{max-width:1120px;padding:24px 24px 40px}
  .wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px}
  .side{display:block;position:sticky;top:24px;align-self:start}
  .main{max-width:640px}
  .nav{display:none}
}
.link{color:var(--steel-2);text-decoration:underline;font-size:13px}
@media (prefers-reduced-motion:no-preference){.punch:active{transform:scale(.97)}}
</style>

<script>
var TK = null, D = null, TAB = 'cong', BUSY = false, QC = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function store(k, v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e) {} }
function load(k){ try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch(e) { return null; } }

function toast(msg, bad){
  var t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, bad ? 5000 : 2800);
}

function call(fn, args, ok, onErr){
  if (BUSY) return;
  BUSY = true;
  google.script.run
    .withSuccessHandler(function(r){ BUSY = false; ok(r); })
    .withFailureHandler(function(e){
      BUSY = false;
      var m = (e && e.message) ? e.message : String(e);
      if (m.indexOf('HET_PHIEN') >= 0) { store('tk', null); TK = null; showLogin(); toast('Phiên đăng nhập đã hết. Đăng nhập lại.', true); return; }
      if (onErr) onErr(m); else toast(m, true);
    })[fn].apply(null, args);
}

/* ---------- ĐĂNG NHẬP ---------- */

function luuTK(tk, nho){
  try { localStorage.removeItem('tk'); sessionStorage.removeItem('tk'); (nho ? localStorage : sessionStorage).setItem('tk', tk); } catch (e) {}
  TK = tk;
}
function nhoMK(id, mk){
  try { if (window.PasswordCredential && navigator.credentials) navigator.credentials.store(new PasswordCredential({id: id, password: mk, name: id})); } catch (e) {}
}
function dangNhapMK(ev){
  if (ev) ev.preventDefault();
  var ten = $('tdn').value.trim(), mk = $('mkd').value, nho = $('nho').checked; $('e0').textContent = '';
  if (!ten || !mk) { $('e0').textContent = 'Nhập tên đăng nhập và mật khẩu.'; return false; }
  $('b0').textContent = 'Đang đăng nhập…';
  call('dangNhapMK', [ten, mk], function(r){
    $('b0').textContent = 'Đăng nhập';
    if (!r.ok) { $('e0').textContent = r.msg; return; }
    store('tdn', ten); store('nho', nho ? '1' : '0'); luuTK(r.token, nho);
    if (nho) nhoMK(ten, mk);
    refresh();
  }, function(m){ $('b0').textContent = 'Đăng nhập'; $('e0').textContent = m; });
  return false;
}

function showLogin(){
  var nho = load('nho') !== '0';
  khungDN('<h2>Đăng nhập hệ thống chấm công</h2>' +
    '<form id="fDN" onsubmit="return dangNhapMK(event)" autocomplete="on">' +
    '<label for="tdn">Tên đăng nhập</label><input id="tdn" name="username" type="text" autocomplete="username" placeholder="Gmail hoặc mã nhân viên">' +
    '<label for="mkd">Mật khẩu</label><input id="mkd" name="password" type="password" autocomplete="current-password">' +
    '<label style="display:flex;gap:8px;align-items:center;margin:10px 0 4px;font-size:14px;color:var(--ink,#333)"><input type="checkbox" id="nho" style="width:auto"' + (nho ? ' checked' : '') + '> Ghi nhớ đăng nhập và lưu mật khẩu trên máy này</label>' +
    '<p id="e0" class="err"></p><button class="main" id="b0" type="submit">Đăng nhập</button></form>' +
    '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:14px;font-size:13px">' +
    '<a href="javascript:void(0)" style="color:var(--steel);font-weight:600" onclick="showMa(\'dk\')">Đăng ký lần đầu</a>' +
    '<a href="javascript:void(0)" style="color:#D7262E;font-weight:600" onclick="showMa(\'quen\')">Quên mật khẩu?</a></div>');
  var tdn = load('tdn') || load('em'); if (tdn) { $('tdn').value = tdn; $('mkd').focus(); }
}
function showMa(kieu){
  khungDN('<h2>' + (kieu === 'quen' ? 'Lấy lại mật khẩu' : 'Đăng ký tài khoản lần đầu') + '</h2>' +
    '<div class="buoc"><i>1</i><span>Nhập <b>Gmail công ty cấp cho bạn</b>, bấm <b>Gửi mã xác minh</b>.</span></div>' +
    '<div class="buoc"><i>2</i><span>Mở Gmail, lấy <b>mã 6 số</b>, nhập vào và bấm <b>Xác minh</b>.</span></div>' +
    '<div class="buoc"><i>3</i><span>Đặt <b>mật khẩu</b> mới. Từ lần sau đăng nhập bằng mật khẩu.</span></div>' +
    '<div id="khungMa"><label for="em">Gmail công ty</label>' +
    '<input id="em" type="email" autocomplete="email" placeholder="ten.nhanvien@gmail.com">' +
    '<p id="e1" class="err"></p><button class="main" id="b1" onclick="sendOtp()">Gửi mã xác minh</button>' +
    '<div id="otpBox" style="display:none"><label for="otp">Mã 6 số trong Gmail</label>' +
    '<input id="otp" inputmode="numeric" maxlength="6" class="pin" autocomplete="one-time-code">' +
    '<p id="e2" class="err"></p><button class="main" onclick="verifyOtp()">Xác minh</button></div></div>' +
    '<p style="text-align:center;margin:14px 0 0;font-size:13px"><a href="javascript:void(0)" style="color:var(--steel);font-weight:600" onclick="showLogin()">← Quay lại đăng nhập</a></p>');
  var last = load('em') || load('tdn'); if (last && last.indexOf('@') > 0) $('em').value = last;
}

function sendOtp(){
  var em = $('em').value.trim(); $('e1').textContent = '';
  if (!em) { $('e1').textContent = 'Nhập Gmail công ty.'; return; }
  $('b1').textContent = 'Đang gửi…';
  call('guiMaOTP', [em], function(r){

function gioTC(){
  var b = $('tcB').value, k = $('tcK').value;
  if (!b || !k) return 0;
  var pb = b.split(':'), pk = k.split(':');
  return Math.round(((Number(pk[0]) * 60 + Number(pk[1])) - (Number(pb[0]) * 60 + Number(pb[1]))) / 30) / 2;
}
function updTC(){
  if (!$('tcG')) return;
  var g = Math.max(0, gioTC()), hs = heSoTC($('tcN').value), lg = (D.tangCa || {}).luongGio || 0;
  $('tcG').textContent = g + ' giờ';

    '<div class="row"><span>Hệ số (' + (hs === 3 ? 'ngày lễ, tết' : hs === 2 ? 'Chủ nhật' : 'ngày thường') + ')</span><span>' + (hs * 100) + '%</span></div>' +
    '<div class="row" style="font-weight:600"><span>Tiền tăng ca dự kiến</span><span>' + tien(lg * hs * g) + ' đ</span></div>'

function doiGio(x){

function nopKPI(){
  var th = $('kT').value, dt = $('kD').value, g = $('kG').value.trim(), e = $('kE');

  if (dt === '' || Number(dt) < 0 || Number(dt) > 100) { e.textContent = 'Điểm tự đánh giá từ 0 đến 100.'; return; }
  e.textContent = 'Đang chuẩn bị file…';
  docTep(fl, function(tep){
    e.textContent = '';
    askPin('Nhập mã PIN để ký và nộp đánh giá tháng ' + th + '.', function(pin){
      call('guiDon', [TK, {loai:'Đánh giá KPI', thang:th, diemTu:dt, lyDo:g, file:tep}, pin], function(){ closeLayer(); toast('Đã nộp đánh giá'); refresh(); }, pinErr);
    });

}

function napMT(){

function addDays(iso, n){ var p = iso.split('-').map(Number); var d = new Date(Date.UTC(p[0], p[1]-1, p[2] + n)); return d.toISOString().slice(0,10); }
function vn(iso){ var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function clrErr(){ var e = $('eDon'); if (e) e.textContent = ''; }

function onLoai(){
  if (!$('loai')) return;
  var l = $('loai').value, tc = l === 'Tăng ca', tu = l === 'Tạm ứng lương', td = l === 'Trình duyệt', nvc = l === 'Xin nghỉ việc';
  $('tu').parentNode.style.display = (tu || td) ? 'none' : 'block';
  $('wTien').style.display = tu ? 'block' : 'none';
  $('wTrinh').style.display = td ? 'block' : 'none';
  $('wBG').style.display = nvc ? 'block' : 'none';
  $('lyL').textContent = td ? 'Ghi chú trình' : 'Lý do';
  $('wDen').style.display = (tc || tu || td || nvc) ? 'none' : 'block';
  $('wGio').style.display = tc ? 'block' : 'none';
  $('wNua').style.display = (tc || tu || td || nvc) ? 'none' : 'flex';
  $('lbTu').textContent = nvc ? 'Ngày làm việc cuối cùng' : tc ? 'Ngày tăng ca' : 'Từ ngày';
  var min = '', hint = '';
  if (l === 'Nghỉ phép năm' || l === 'Nghỉ không lương') {
    min = addDays(D.homNayISO, D.baoTruoc);
    hint = 'Theo nội quy, đơn phải nộp trước ít nhất ' + D.baoTruoc + ' ngày. Sớm nhất được nghỉ từ ' + vn(min) + '.' +
      (l === 'Nghỉ phép năm' ? ' Bạn còn ' + D.phep.conLai + ' ngày phép.' : '');
  } else if (l === 'Nghỉ đột xuất') {
    hint = 'Dùng khi ốm đau, tai nạn, việc tang hoặc việc khẩn cấp. Đơn được đánh dấu đột xuất, trưởng phòng quyết định có tính phép hay không.';
  } else if (nvc) {
    hint = 'Theo Điều 35 Bộ luật Lao động 2019: báo trước ít nhất 45 ngày (hợp đồng không xác định thời hạn), 30 ngày (hợp đồng 12–36 tháng), 3 ngày làm việc (hợp đồng dưới 12 tháng); đang thử việc thì không cần báo trước. Duyệt 2 bước: quản lý trực tiếp, rồi Giám đốc. Sau khi gửi, bấm "In đơn" để in ra ký và lưu hồ sơ.';
  } else if (td) {
    hint = 'In đơn hoặc tờ trình, ký xong chụp ảnh hay scan PDF tải lên. Đơn được chuyển lên cấp quản lý duyệt, có ghi chú trình và ghi chú duyệt.';
  } else if (tu) {
    hint = 'Theo Điều 17.6 Quy chế lương: chỉ nhân viên chính thức được tạm ứng, tối đa 50% lương cơ bản của số ngày đã làm, đề nghị trong khung ngày công ty quy định. Duyệt 2 bước: Giám đốc duyệt, kế toán duyệt và lập lệnh chi; trừ vào lương tháng đó.';
  } else {
    hint = 'Tăng ca chỉ được tính tiền khi trưởng phòng duyệt.';
  }
  $('tu').min = min;
  $('hint').textContent = hint;
  clrErr();
}

function nopDon(){
  var f = { loai:$('loai').value, tu:$('tu').value, den:$('den').value, nuaNgay:$('nua').checked, soGio:$('gio').value, soTien:$('tien').value, tieuDe:$('tdT').value.trim(), capDuyet:$('tdC').value, lyDo:$('ly').value.trim(), banGiao:($('bg') ? $('bg').value.trim() : '') };
  var e = $('eDon');
  if (f.loai === 'Trình duyệt') {
    if (!f.tieuDe) { e.textContent = 'Nhập tiêu đề tờ trình.'; return; }
    var fl = $('tdF').files && $('tdF').files[0];
    if (!fl) { e.textContent = 'Đính kèm bản đã ký (ảnh hoặc PDF).'; return; }
    e.textContent = 'Đang chuẩn bị tệp…';
    docTep(fl, function(tep){
      e.textContent = ''; f.file = tep;
      askPin('Nhập mã PIN để ký và trình duyệt.', function(pin){
        call('guiDon', [TK, f, pin], function(){ closeLayer(); toast('Đã trình duyệt'); refresh(); }, pinErr);
      });
    }, function(m){ e.textContent = m; });
    return;
  }
  if (!f.tu && f.loai !== 'Tạm ứng lương') { e.textContent = 'Chọn ngày.'; return; }
  if (f.loai === 'Tạm ứng lương' && !(Number(f.soTien) > 0)) { e.textContent = 'Nhập số tiền tạm ứng.'; return; }
  if ((f.loai === 'Nghỉ phép năm' || f.loai === 'Nghỉ không lương') && f.tu < addDays(D.homNayISO, D.baoTruoc)) {
    e.textContent = f.loai + ' phải nộp trước ít nhất ' + D.baoTruoc + ' ngày. Trường hợp khẩn cấp hãy chọn "Nghỉ đột xuất".'; return;
  }
  if (f.loai !== 'Tăng ca' && f.den && f.den < f.tu) { e.textContent = 'Ngày kết thúc phải sau ngày bắt đầu.'; return; }
  if (f.loai === 'Tăng ca' && !(Number(f.soGio) > 0)) { e.textContent = 'Nhập số giờ tăng ca.'; return; }
  if (!f.lyDo) { e.textContent = 'Nhập lý do.'; return; }
  askPin('Nhập mã PIN để ký và gửi đơn.', function(pin){
    call('guiDon', [TK, f, pin], function(){ closeLayer(); toast('Đã gửi đơn, chờ duyệt'); refresh(); },
      function(m){ pinErr(m); });
  });
}

var TIEU_DE_DON = {'Xin nghỉ việc': 'ĐƠN XIN NGHỈ VIỆC', 'Nghỉ phép năm': 'ĐƠN XIN NGHỈ PHÉP NĂM', 'Nghỉ không lương': 'ĐƠN XIN NGHỈ KHÔNG HƯỞNG LƯƠNG',

var BG_MAU = [['Công việc đang thực hiện', 'Đầu việc, tiến độ, việc còn dở, đầu mối liên hệ'], ['Hồ sơ, tài liệu, dữ liệu', 'Hồ sơ giấy, file, thư mục Drive, email công việc'],

var BG_DANG = null;
function timBG(maDon){ return [].concat(D.banGiao || [], (QT && QT.banGiao) || [], (HSD && HSD.banGiao) || []).filter(function(b){ return b.maDon === maDon; })[0]; }
function nutBG(maDon){

  return '<button class="small" onclick="moBG(\'' + maDon + '\')">Biên bản bàn giao</button>' +
    (b ? ' <span class="pill ' + (b.tep ? 'p-ok' : 'p-wait') + '">' + esc(b.trangThai || 'Bản nháp') + '</span>' + (b.tep ? ' <button class="small" onclick="xemTep(\'' + b.maBG + '\')">Xem bản đã ký</button>' : '') : '');
}
function moBG(maDon){
  var d = [].concat(D.dons || [], D.choDuyet || [], (QT && QT.nghiViec) || [], (HSD && HSD.donGan) || []).filter(function(x){ return x.ma === maDon; })[0];
  if (!d) { toast('Không tìm thấy đơn', true); return; }
  var b = timBG(maDon) || {};
  var tsNV = d.ten === D.nv.ten ? (D.taiSan || []) : (HSD && HSD.ten === d.ten ? (HSD.taiSan || []) : []);
  var tsLoc = function(tk){ return tsNV.filter(function(t){ return (t.loai === 'Tài khoản phần mềm') === tk && t.tinhTrang !== 'Đã thu hồi'; }).map(function(t){ return '- ' + (tk ? t.ten + (t.tenDN ? ': ' + t.tenDN : '') : (t.loai ? t.loai + ': ' : '') + t.ten + (t.maSo ? ' (' + t.maSo + ')' : '')) + ' – ' + t.tinhTrang; }).join('\n'); };

function docTep(fl, ok, err){
  var laDoc = /\.docx$/i.test(fl.name || '');
  if (fl.type === 'application/pdf' || laDoc) {
    if (fl.size > 8e6) { err('Tệp quá lớn, tối đa 8 MB.'); return; }
    var mimeT = laDoc ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : 'application/pdf';
    var rd = new FileReader();
    rd.onload = function(){ ok({mime: mimeT, data: String(rd.result).split(',')[1]}); };
    rd.onerror = function(){ err('Không đọc được tệp.'); };
    rd.readAsDataURL(fl);
    return;
  }
  if (!/^image\//.test(fl.type)) { err('Chỉ nhận ảnh hoặc PDF.'); return; }
  var img = new Image(), u = URL.createObjectURL(fl);
  img.onload = function(){
    var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, 1800 / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    ok({mime:'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1]});
  };
  img.onerror = function(){ err('Không đọc được ảnh.'); };
  img.src = u;
}

/* ---------- TÚI LỊCH SỬ ---------- */

var LS_TAB = {cong:['chamcong','chấm công'], homnay:['chamcong','chấm công các ngày'], tangca:['tangca','tăng ca'], don:['don','đơn từ'],
  kpi:['kpi','giao việc, đánh giá KPI'], solieu:['solieu','KPI, thưởng, doanh số'], vipham:['vipham','vi phạm'], donhang:['donhang','đơn hàng bị trả, treo, lỗi']};
function tuiTheoTab(){
  var x = LS_TAB[TAB];
  var s = x ? tuiLichSu(x[0], x[1]) : '';
  if (TAB === 'solieu') s += tuiLichSu('kpi', 'giao việc, đánh giá KPI');
  return s;
}
var LS_XEM = null;
function cacThang(){ var a = [], d = new Date(); for (var i = 0; i < 6; i++) { var y = d.getFullYear(), m = d.getMonth() + 1 - i; while (m < 1) { m += 12; y--; } a.push(y + '-' + String(m).padStart(2, '0')); } return a; }
function tenThang(t){ return 'Tháng ' + Number(t.slice(5)) + '/' + t.slice(0, 4); }
function tuiLichSu(loai, ten){
  return '<div class="box"><b>Lịch sử ' + ten + '</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' +
    cacThang().map(function(t){ return '<button class="small" onclick="moLS(\'' + loai + '\',\'' + esc(ten) + '\',\'' + t + '\')">' + tenThang(t) + '</button>'; }).join('') + '</div></div>';
}
function moLS(loai, ten, thang, ma){
  var st = LS[loai] || (LS[loai] = {thang: thang, ma: '*', data: undefined, mo: true});
  st.thang = thang; st.loc = ''; if (ma) st.ma = ma; st.data = undefined; st.mo = true;
  LS_XEM = {loai: loai, ten: ten, ve: (TAB === 'lichsu' && LS_XEM) ? LS_XEM.ve : TAB};
  go('lichsu'); window.scrollTo(0, 0);
}
function vLichSu(){
  if (!LS_XEM || !LS[LS_XEM.loai]) return '<div class="box muted">Chọn tháng cần xem.</div>';
  var loai = LS_XEM.loai, st = LS[loai];
  var ql = ['TP','GD','HCNS','KT'].indexOf(D.nv.vaiTro) >= 0;
  if (ql && !NVALL) {
    NVALL = [];
    google.script.run.withSuccessHandler(function(r){ NVALL = r || []; var sel = document.querySelectorAll('.lsNV'); for (var i = 0; i < sel.length; i++) sel[i].innerHTML = optNVLS(sel[i].getAttribute('data-loai')); }).withFailureHandler(function(){}).dsNhanVienTatCa(TK);
  }
  if (st.data === undefined) setTimeout(function(){ taiLS(loai); }, 0);
  return '<button class="small" onclick="go(\'' + LS_XEM.ve + '\')">← Quay lại</button>' +
    '<h2 style="margin:10px 0 8px">Lịch sử ' + esc(LS_XEM.ten) + ' · ' + tenLoc(st) + '</h2>' +
    '<div class="seg nho">' + cacThang().map(function(t){ return '<button class="' + (st.thang === t ? 'on' : '') + '" onclick="moLS(\'' + loai + '\',\'' + esc(LS_XEM.ten) + '\',\'' + t + '\')">' + tenThang(t) + '</button>'; }).join('') + '</div>' +
    '<div class="locLS">' + (ql ? '<div style="flex:1;min-width:220px;max-width:340px"><label>Nhân viên</label><select class="lsNV" data-loai="' + loai + '" onchange="LS[\'' + loai + '\'].ma = this.value; taiLS(\'' + loai + '\')">' + optNVLS(loai) + '</select></div>' : '') +
    '<div><label>Xem nhanh</label><div class="seg nho" style="margin:0">' + [['', 'Cả tháng'], ['nay', 'Hôm nay'], ['qua', 'Hôm qua'], ['tuan', 'Tuần này']].map(function(b){ return '<button class="' + ((st.loc || '') === b[0] ? 'on' : '') + '" onclick="chonLoc(\'' + loai + '\',\'' + b[0] + '\')">' + b[1] + '</button>'; }).join('') + '</div></div>' +
    '<div><label>Chọn ngày</label><input type="date" style="width:auto" value="' + (/^\d{4}-/.test(st.loc || '') ? st.loc : '') + '" onchange="chonLoc(\'' + loai + '\', this.value)"></div></div>' +
    '<div id="ls-' + loai + '">' + (st.data ? dsLS(locLS(st.data, st.loc)) : '<p class="muted">Đang tải…</p>') + '</div>';
}
function ngayISO(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function isoVN(s){ var m = String(s || '').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }
function khoangLoc(loc){
  var d = new Date();
  if (loc === 'nay') { var t = ngayISO(d); return [t, t]; }
  if (loc === 'qua') { d.setDate(d.getDate() - 1); var q = ngayISO(d); return [q, q]; }
  if (loc === 'tuan') { var a = new Date(d); a.setDate(d.getDate() - (d.getDay() + 6) % 7); return [ngayISO(a), ngayISO(d)]; }
  if (/^\d{4}-\d{2}-\d{2}$/.test(loc || '')) return [loc, loc];
  return null;
}
function locLS(a, loc){ var k = khoangLoc(loc); if (!k || !a) return a || []; return a.filter(function(x){ var i = isoVN(x.ngay); return i >= k[0] && i <= k[1]; }); }
function tenLoc(st){
  var k = khoangLoc(st.loc), vn = function(s){ return s.split('-').reverse().join('/'); };
  if (!k) return tenThang(st.thang);
  return {nay: 'Hôm nay ', qua: 'Hôm qua ', tuan: 'Tuần này '}[st.loc] ? ({nay: 'Hôm nay', qua: 'Hôm qua', tuan: 'Tuần này'}[st.loc] + ' (' + (k[0] === k[1] ? vn(k[0]) : vn(k[0]) + ' – ' + vn(k[1])) + ')') : 'Ngày ' + vn(k[0]);
}
function chonLoc(loai, loc){
  var st = LS[loai]; st.loc = loc || '';
  var k = khoangLoc(st.loc), th = k ? k[1].slice(0, 7) : st.thang;
  if (th !== st.thang) { st.thang = th; st.data = undefined; }
  render();
}
function optNVLS(loai){
  var st = LS[loai] || {ma: '*'};
  return '<option value="*">Tất cả</option>' + (NVALL || []).map(function(x){ return '<option value="' + esc(x.ma) + '"' + (st.ma === x.ma ? ' selected' : '') + '>' + esc(x.ten) + '</option>'; }).join('');
}
function taiLS(loai){
  var st = LS[loai]; st.data = null;
  var c = $('ls-' + loai); if (c) c.innerHTML = '<p class="muted">Đang tải…</p>';
  google.script.run.withSuccessHandler(function(r){ st.data = r || []; var c = $('ls-' + loai); if (c) c.innerHTML = dsLS(locLS(st.data, st.loc)); })
    .withFailureHandler(function(e){ st.data = []; var c = $('ls-' + loai); if (c) c.innerHTML = '<p class="err">' + esc((e && e.message) || String(e)) + '</p>'; })
    .lichSu(TK, loai, st.thang, st.ma);
}
function dsLS(a){
  if (!a.length) return '<p class="muted">Không có dữ liệu trong khoảng đã chọn.</p>';
  return '<p class="muted" style="font-size:12px;margin:8px 0 0">' + a.length + ' mục</p>' + a.map(function(x){
    return '<div style="border-top:1px solid var(--line);padding:8px 0"><div class="row"><b style="font-weight:500">' + esc(x.tieuDe) + '</b>' + (x.trangThai ? pillOf(x.trangThai) : '') + '</div>' +
      '<div class="muted" style="font-size:12px">' + esc(x.ngay) + ' · ' + esc(x.ten) + (x.phong ? ' · ' + esc(x.phong) : '') + '</div>' +
      (x.chiTiet ? '<div style="white-space:pre-wrap;font-size:14px">' + esc(x.chiTiet) + '</div>' : '') +
      (x.ghiChu ? '<div class="muted" style="font-size:13px">' + esc(x.ghiChu) + '</div>' : '') +
      (x.tep || x.anhVao || x.anhRa ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">' + (x.tep ? '<button class="small" onclick="xemTep(\'' + x.tep + '\')">Xem tệp</button>' : '') +
        (x.anhVao ? '<button class="small" onclick="xemAnh(\'' + x.anhVao + '\')">Ảnh vào</button>' : '') + (x.anhRa ? '<button class="small" onclick="xemAnh(\'' + x.anhRa + '\')">Ảnh ra</button>' : '') + '</div>' : '') + '</div>';
  }).join('');
}
function doiPin(){
  $('layer').innerHTML = '<div class="veil"><div class="sheet"><h2 style="margin-top:0">Đổi mã PIN</h2>' +
    '<label for="p0">PIN hiện tại</label><input id="p0" type="password" inputmode="numeric" maxlength="4" class="pin">' +
    '<label for="p1">PIN mới</label><input id="p1" type="password" inputmode="numeric" maxlength="4" class="pin">' +
    '<p id="pe" class="err"></p><div class="grid2"><button onclick="closeLayer()">Hủy</button><button class="main" id="okb">Lưu</button></div></div></div>';
  $('okb').onclick = function(){
    var a = $('p0').value.trim(), b = $('p1').value.trim();
    if (!/^\d{4}$/.test(a) || !/^\d{4}$/.test(b)) { $('pe').textContent = 'PIN gồm đúng 4 chữ số.'; return; }
    setPin(a, b);
  };
}
